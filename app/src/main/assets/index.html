<style>
/* Layout: mobile-first app shell — top bar, one view at a time, fixed bottom tabs; wardrobe as a photo grid, outfits as a flat-lay board */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --sunk: #e3e8ee;
  --ink: #16212c;
  --muted: #5a6573;
  --line: #d6dde5;
  --accent: #1f5a7e;

  --accent-soft: #d7e7f2;
  --brass: #c8901a;
  --brass-soft: #f7e6bf;
  --danger: #b3261e;
  --shadow: 0 1px 2px rgba(22,33,44,.08), 0 6px 18px rgba(22,33,44,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1319; --surface: #171f28; --sunk: #202a35; --ink: #e7edf3; --muted: #97a3b1; --line: #2a3542;
  --accent: #82b8dc; --accent-ink: #0a1824; --accent-soft: #1d3446; --brass: #f0bd52; --brass-soft: #3a2f16; --danger: #ff8a80;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #171f28; --sunk: #202a35; --ink: #e7edf3; --muted: #97a3b1; --line: #2a3542;
  --accent: #82b8dc; --accent-ink: #0a1824; --accent-soft: #1d3446; --brass: #f0bd52; --brass-soft: #3a2f16; --danger: #ff8a80;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand svg { flex: none; color: var(--accent); }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; letter-spacing: -.01em; margin: 0; }
.store-chip { font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 3px 9px; white-space: nowrap; }
.store-chip.cloud { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }

main { padding-block: 16px 120px; }
.view { display: grid; gap: 16px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: .92rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -2px; padding-inline: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrapr { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 13px; font-size: .9rem; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.chip .n { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }

.banner { background: var(--brass-soft); border: 1px solid color-mix(in srgb, var(--brass) 45%, transparent); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner p { margin: 0; flex: 1 1 220px; min-width: 0; }
.banner b { font-weight: 600; }

/* Wardrobe grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; text-align: left; padding: 0; display: flex; flex-direction: column; min-width: 0; }
.item:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.ph { aspect-ratio: 1 / 1; width: 100%; max-width: 100%; position: relative; background: var(--sunk); display: grid; place-items: center; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .glyph { width: 46%; height: 46%; }
.ph .badge { position: absolute; top: 8px; left: 8px; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; background: var(--surface); color: var(--muted); border-radius: 6px; padding: 2px 6px; }
.meta { padding: 9px 11px 11px; display: grid; gap: 2px; min-width: 0; }
.meta .nm { font-weight: 600; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .kd { color: var(--muted); font-size: .8rem; display: flex; align-items: center; gap: 6px; min-width: 0; }
.meta .kd span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; border: 1px dashed var(--line); border-radius: var(--r); }

/* Outfit board */
.controls { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.controls .grp { display: grid; gap: 6px; min-width: 0; }
.outfits { display: grid; gap: 16px; }
.outfit { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.tagline { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px dashed var(--line); }
.hole { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); flex: none; }
.tagline h3 { font-family: var(--f-display); font-size: 1.05rem; margin: 0; flex: 1; min-width: 0; }
.score { font-variant-numeric: tabular-nums; font-size: .8rem; color: var(--muted); }
.board { display: grid; grid-template-columns: 3fr 2fr; gap: 10px; padding: 12px; }
.board .col { display: grid; gap: 10px; align-content: start; min-width: 0; }
.board .acc { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 600px) { .board .acc { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
[hidden] { display: none !important; }
.slot { position: relative; border-radius: 12px; overflow: hidden; background: var(--sunk); border: 2px solid transparent; padding: 0; text-align: left; display: block; width: 100%; min-width: 0; }
.slot .ph { border-radius: 0; }
.slot.main .ph { aspect-ratio: 4 / 3; }
.slot .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; font-size: .75rem; font-weight: 600; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.6)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot.locked { border-color: var(--brass); }
.slot .lock { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--muted); box-shadow: var(--shadow); }
.slot.locked .lock { background: var(--brass); color: #1b1405; }
.slot .lock svg { width: 14px; height: 14px; }
.why { padding: 0 14px 12px; color: var(--muted); font-size: .86rem; display: flex; flex-wrap: wrap; gap: 6px; }
.why span { background: var(--sunk); border-radius: 6px; padding: 2px 8px; }
.actions { display: flex; gap: 8px; padding: 0 12px 12px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 120px; }

/* Saved */
.saved { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; }
.strip .ph { width: 76px; flex: none; border-radius: 10px; }

/* Bottom tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; }
nav.tabs button { background: none; border: 0; padding: 9px 4px 10px; display: grid; justify-items: center; gap: 2px; font-size: .78rem; font-weight: 600; color: var(--muted); }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
.fab { position: fixed; z-index: 21; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); display: grid; place-items: center; }
.fab svg { width: 26px; height: 26px; }

/* Sheet */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8,12,18,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 620px; max-height: 92%; overflow-y: auto; border-radius: 20px 20px 0 0; padding-block: 16px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }

.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { flex: 1; }
.photo-box { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: center; }
.photo-box .ph { border-radius: 12px; border: 1px solid var(--line); }
.photo-btns { display: grid; gap: 8px; min-width: 0; }
.ai-note { font-size: .84rem; color: var(--accent); min-height: 1.2em; }
.field { display: grid; gap: 6px; min-width: 0; }
.field input[type=text] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.sw-name { font-size: .84rem; color: var(--muted); }
.confirm { background: var(--surface); border: 1px solid var(--danger); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.confirm p { margin: 0; flex: 1 1 180px; }

.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 500; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; display: inline-block; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

function seasonNow() { const m = new Date().getMonth(); return m <= 1 || m === 11 ? "Kış" : m <= 4 ? "İlkbahar" : m <= 7 ? "Yaz" : "Sonbahar"; }
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- Toast ---------- */
let toastT;
function toast(msg) {
  let el = $("#toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.append(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2800);
}

/* ---------- Image helpers ---------- */
async function shrink(file, max, q) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch { src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const w0 = src.width, h0 = src.height, k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement("canvas"); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", q));
}
const toDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
function imgSrc(it) { return it.imgId ? "/_blob/" + it.imgId : (it.img || ""); }

function thumb(it, extra = "") {
  const src = imgSrc(it);
  if (src) return `<div class="ph">${extra}<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()"></div>`;
  const c = COL[it.color] || COL.Gri;
  const fill = c.pat ? "var(--muted)" : c.h;
  return `<div class="ph" style="background:color-mix(in srgb, ${c.pat ? "#888" : c.h} 16%, var(--sunk))">${extra}<svg class="glyph" viewBox="0 0 24 24" fill="${fill}" stroke="var(--ink)" stroke-opacity=".35" stroke-width="1" stroke-linejoin="round" aria-hidden="true">${GLYPH[it.cat] || GLYPH.aksesuar}</svg></div>`;
}
function dot(color) { const c = COL[color]; if (!c) return ""; return `<span class="dot" style="background:${c.h}"></span>`; }

/* ---------- Storage: cloud (db + assets) or this device (IndexedDB) ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("gardirobum", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("items", { keyPath: "id" }); r.result.createObjectStore("outfits", { keyPath: "id" }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbAll(store) { return new Promise((res, rej) => { const q = idb.transaction(store).objectStore(store).getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
function idbPut(store, v) { return new Promise((res, rej) => { const t = idb.transaction(store, "readwrite"); t.objectStore(store).put(v); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
function idbDel(store, id) { return new Promise((res, rej) => { const t = idb.transaction(store, "readwrite"); t.objectStore(store).delete(id); t.oncomplete = res; t.onerror = () => rej(t.error); }); }

async function useLocal() {
  try { idb = await idbOpen(); S.items = await idbAll("items"); S.outfits = await idbAll("outfits"); S.mode = "local"; }
  catch { idb = null; S.mode = "memory"; }
  sortAll(); render();
}
function sortAll() { S.items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); S.outfits.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); }

async function init() {
  render();
  const c = window.claude;
  if (!c || typeof c.use !== "function") return useLocal();
  const get = n => c.use(n).catch(() => null);
  [db, assets, sample] = await Promise.all([get("db"), get("assets"), get("sample")]);
  if (sample) { try { sampleImages = !!(await sample.limits()).images; } catch { sampleImages = false; } }
  if (!db) return useLocal();
  let gotItems = false, failed = false;
  const timer = setTimeout(() => { if (!gotItems && !failed) { failed = true; db = null; useLocal(); toast("Bulut yanıt vermedi, bu cihaza kaydediliyor."); } }, 10000);
  const onErr = e => { if (failed) return; if (!gotItems) { failed = true; clearTimeout(timer); db = null; useLocal(); } else if (e && e.code === "revoked") { toast("Erişim değişti. Sayfayı yenileyin."); } };
  db.collection("items").onSnapshot(snap => {
    if (failed) return; gotItems = true; clearTimeout(timer); S.mode = "cloud";
    S.items = snap.docs.map(d => ({ ...d.data(), id: d.id })); sortAll(); pruneLocks(); render();
  }, onErr);
  db.collection("outfits").onSnapshot(snap => {
    if (failed) return; S.outfits = snap.docs.map(d => ({ ...d.data(), id: d.id })); sortAll(); if (gotItems) render();
  }, () => {});
}

async function saveItem(data, blob) {
  const id = data.id || uid();
  const prev = S.items.find(i => i.id === id);
  const doc = { name: data.name, cat: data.cat, sub: data.sub, color: data.color, styles: data.styles, seasons: data.seasons, person: data.person, createdAt: prev?.createdAt || Date.now() };
  if (prev) { if (prev.imgId) doc.imgId = prev.imgId; if (prev.img) doc.img = prev.img; }
  if (S.mode === "cloud") {
    if (blob) {
      let up = null;
      if (assets) { try { up = await assets.upload(blob, { type: "image/jpeg" }); } catch { up = null; } }
      if (up) { doc.imgId = up.id; delete doc.img; }
      else { doc.img = await toDataURL(await shrink(blob, 420, .72)); delete doc.imgId; }
      if (prev?.imgId && prev.imgId !== doc.imgId && assets) assets.delete(prev.imgId).catch(() => {});
    }
    await db.collection("items").doc(id).set(doc);
  } else {
    if (blob) { doc.img = await toDataURL(blob); }
    const full = { ...doc, id };
    if (idb) await idbPut("items", full);
    const ix = S.items.findIndex(i => i.id === id); if (ix >= 0) S.items[ix] = full; else S.items.push(full);
    sortAll(); render();
  }
}
async function deleteItem(id) {
  const it = S.items.find(i => i.id === id); if (!it) return;
  if (S.mode === "cloud") {
    await db.collection("items").doc(id).delete();
    if (it.imgId && assets) assets.delete(it.imgId).catch(() => {});
  } else {
    if (idb) await idbDel("items", id);
    S.items = S.items.filter(i => i.id !== id); render();
  }
  pruneLocks();
}
async function saveOutfit(o) {
  const id = uid(); const doc = { ids: o.ids, title: o.title, occ: S.occ, season: S.season, createdAt: Date.now() };
  if (S.mode === "cloud") await db.collection("outfits").doc(id).set(doc);
  else { if (idb) await idbPut("outfits", { ...doc, id }); S.outfits.unshift({ ...doc, id }); render(); }
}
async function deleteOutfit(id) {
  if (S.mode === "cloud") await db.collection("outfits").doc(id).delete();
  else { if (idb) await idbDel("outfits", id); S.outfits = S.outfits.filter(o => o.id !== id); render(); }
}
function pruneLocks() { for (const k in S.locks) if (!byId(S.locks[k])) delete S.locks[k]; }

/* ---------- Outfit engine ---------- */
function seasonOk(it, s) { return !it.seasons || !it.seasons.length || it.seasons.includes(s); }
function personOk(it, p) { return !p || !it.person || it.person === p; }
function styleW(it) { if (S.occ === "Hepsi" || !it.styles || !it.styles.length) return 1; return it.styles.includes(S.occ) ? 3 : 0.35; }
function wpick(list, used) {
  if (!list.length) return null;
  const w = list.map(i => styleW(i) * (used.has(i.id) ? 0.25 : 1));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let k = 0; k < list.length; k++) { r -= w[k]; if (r <= 0) return list[k]; }
  return list[list.length - 1];
}
function poolFor() {
  const all = shownItems().filter(i => personOk(i, S.forPerson) && seasonOk(i, S.season));
  const g = {}; CATS.forEach(c => g[c.k] = all.filter(i => i.cat === c.k)); return g;
}
function buildOne(P, used) {
  const L = S.locks, pick = [], take = it => { if (it) pick.push(it); return it; };
  const lk = k => L[k] ? byId(L[k]) : null;
  // body
  const lockedDress = lk("elbise"), lockedTop = lk("ust"), lockedBottom = lk("alt");
  const canSep = P.ust.length && P.alt.length;
  let useDress = !!lockedDress || (!lockedTop && !lockedBottom && P.elbise.length && (!canSep || Math.random() < P.elbise.length / (P.elbise.length + Math.min(P.ust.length, P.alt.length) + 1)));
  if (useDress) take(lockedDress || wpick(P.elbise, used));
  else { take(lockedTop || wpick(P.ust, used)); take(lockedBottom || wpick(P.alt, used)); }
  // outer
  const outerP = { "Kış": 1, "Sonbahar": .65, "İlkbahar": .5, "Yaz": .08 }[S.season];
  if (lk("dis")) take(lk("dis")); else if (P.dis.length && Math.random() < outerP) take(wpick(P.dis, used));
  take(lk("ayakkabi") || wpick(P.ayakkabi, used));
  if (lk("saat")) take(lk("saat")); else if (P.saat.length && Math.random() < .75) take(wpick(P.saat, used));
  // jewelry: up to 2 different kinds
  const jl = lk("taki"); if (jl) take(jl);
  const jMax = S.occ === "Şık" ? 2 : S.occ === "Spor" ? 0 : 1 + (Math.random() < .4 ? 1 : 0);
  const jPool = P.taki.filter(j => !jl || j.sub !== jl.sub);
  for (let n = pick.filter(i => i.cat === "taki").length; n < jMax && jPool.length; n++) {
    const j = wpick(jPool.filter(x => !pick.some(p => p.cat === "taki" && p.sub === x.sub)), used); if (!j) break; take(j);
  }
  if (lk("aksesuar")) take(lk("aksesuar")); else if (P.aksesuar.length && Math.random() < .6) take(wpick(P.aksesuar, used));
  return pick;
}
const ADJ = new Set(["kirmizi|turuncu", "turuncu|sari", "sari|yesil", "yesil|mavi", "mavi|mor", "kirmizi|mor"]);
const COMP = new Set(["kirmizi|yesil", "turuncu|mavi", "sari|mor"]);
function pairKey(a, b) { const [x, y] = [a, b].sort((p, q) => FAM_ORDER.indexOf(p) - FAM_ORDER.indexOf(q)); return x + "|" + y; }
function score(items) {
  let s = 0; const why = [];
  const wear = items.filter(i => !["saat", "taki"].includes(i.cat));
  const fams = [...new Set(wear.map(i => COL[i.color]?.fam).filter(Boolean))];
  const pats = wear.filter(i => COL[i.color]?.pat).length;
  if (fams.length === 0) { s += 2; why.push("Nötr tonlarla sade ve klasik"); }
  else if (fams.length === 1) { s += 3; why.push(`Nötrlerin üstünde tek renk vurgusu: ${FAM_NAME[fams[0]]}`); }
  else if (fams.length === 2) { const k = pairKey(fams[0], fams[1]); if (ADJ.has(k)) { s += 2; why.push("Komşu renkler, yumuşak geçiş"); } else if (COMP.has(k)) { s += 1.5; why.push("Zıt renkler, cesur bir eşleşme"); } else s -= 1.5; }
  else s -= 4;
  if (pats > 1) s -= 3; else if (pats === 1 && fams.length <= 1) { s += .5; why.push("Tek desenli parça öne çıkıyor"); }
  const metals = new Set(items.filter(i => ["saat", "taki"].includes(i.cat)).map(i => COL[i.color]?.m).filter(Boolean));
  if (metals.size > 1) s -= 1.5; else if (metals.size === 1 && items.filter(i => ["saat", "taki"].includes(i.cat)).length > 1) { s += 1; why.push(`Metaller uyumlu: ${[...metals][0] === "altin" ? "altın" : "gümüş"}`); }
  if (S.occ !== "Hepsi") { const fit = items.filter(i => !i.styles?.length || i.styles.includes(S.occ)).length; s += (fit / items.length) * 3; if (fit === items.length) why.push(`Her parça ${S.occ.toLowerCase()} ortama uygun`); }
  const shoes = items.find(i => i.cat === "ayakkabi"), bag = items.find(i => i.cat === "aksesuar" && i.sub === "Çanta");
  if (shoes && bag && shoes.color === bag.color) { s += 1; why.push("Ayakkabı ve çanta aynı renk"); }
  return { s: s + Math.random() * .6, why };
}
function generate() {
  const P = poolFor();
  const hasBody = (P.ust.length && P.alt.length) || P.elbise.length;
  if (!hasBody) { S.suggestions = []; S.genError = "Kombin için en az bir üst ve bir alt ya da bir elbise gerekiyor" + (S.forPerson ? ` (${S.forPerson} için, ${S.season.toLowerCase()} mevsiminde).` : ` (${S.season.toLowerCase()} mevsiminde).`); render(); return; }
  S.genError = "";
  const used = new Set(), cands = [];
  for (let n = 0; n < 80; n++) { const its = buildOne(P, used); const sc = score(its); cands.push({ its, ...sc }); }
  cands.sort((a, b) => b.s - a.s);
  const out = [], keys = new Set();
  for (const c of cands) {
    const key = c.its.map(i => i.id).sort().join(",");
    if (keys.has(key)) continue;
    const mainIds = c.its.filter(i => ["ust", "alt", "elbise", "dis", "ayakkabi"].includes(i.cat)).map(i => i.id);
    if (out.some(o => mainIds.filter(id => o.ids.includes(id)).length >= Math.max(2, mainIds.length - 1)) && out.length < cands.length) { if (Object.keys(S.locks).length === 0 || out.length === 0) continue; }
    keys.add(key); out.push({ ids: c.its.map(i => i.id), why: c.why, s: c.s, title: titleFor(c.its) });
    c.its.forEach(i => used.add(i.id));
    if (out.length === 3) break;
  }
  if (out.length < 3) for (const c of cands) { const key = c.its.map(i => i.id).sort().join(","); if (!keys.has(key)) { keys.add(key); out.push({ ids: c.its.map(i => i.id), why: c.why, s: c.s, title: titleFor(c.its) }); } if (out.length === 3) break; }
  S.suggestions = out; render();
}
function titleFor(its) {
  const o = S.occ === "Hepsi" ? "" : S.occ + " ";
  const main = its.find(i => i.cat === "elbise") || its.find(i => i.cat === "ust");
  return `${o}${S.season.toLowerCase()} kombini${main ? ", " + main.name.toLowerCase() + " ile" : ""}`.replace(/^./, c => c.toUpperCase());
}

async function askStylist() {
  if (!sample || S.aiBusy) return;
  const list = shownItems().filter(i => personOk(i, S.forPerson) && seasonOk(i, S.season));
  if (list.length < 3) { toast("Stilist için biraz daha parça ekleyin."); return; }
  S.aiBusy = true; render();
  const lines = list.slice(0, 250).map(i => `${i.id} | ${CAT[i.cat]?.t} / ${i.sub} | ${i.name} | renk: ${i.color} | tarz: ${(i.styles || []).join(", ") || "-"}`).join("\n");
  const prompt = `Sen bir moda stilistisin. Aşağıdaki gardıroptan ${S.season.toLowerCase()} mevsimi ve "${S.occ === "Hepsi" ? "herhangi bir" : S.occ}" ortam için 3 farklı kombin öner.
Kurallar: her kombinde ya (bir üst + bir alt) ya da bir elbise/tulum olsun; bir ayakkabı olsun; uygunsa dış giyim, saat, en fazla 2 takı ve bir aksesuar ekle. Yalnızca listedeki id'leri kullan. Renk uyumuna ve metal (altın/gümüş) uyumuna dikkat et.
Yalnızca şu biçimde JSON dizi döndür: [{"title":"kısa Türkçe başlık","ids":["id1","id2"],"why":"tek cümle Türkçe açıklama"}]

GARDIROP (id | kategori / tür | ad | renk | tarz):
${lines}`;
  try {
    const res = await sample.json(prompt, { modelTier: "default", cache: false });
    const valid = (Array.isArray(res) ? res : []).map(o => ({ title: String(o.title || "Stilist önerisi"), ids: (Array.isArray(o.ids) ? o.ids : []).map(String).filter(id => byId(id)), why: [String(o.why || "")].filter(Boolean), ai: true }))
      .filter(o => o.ids.length >= 2).slice(0, 3);
    if (valid.length) { S.suggestions = valid; S.genError = ""; } else toast("Stilist geçerli bir kombin döndürmedi. Tekrar deneyin.");
  } catch (e) {
    toast(e && e.code === "rate_limited" ? "Stilist şu an meşgul. Biraz sonra deneyin." : e && e.code === "not_granted" ? "Stilist izni verilmedi." : "Stilist yanıt veremedi. Tekrar deneyin.");
  }
  S.aiBusy = false; render();
}

/* ---------- Views ---------- */
function persons() { return [...new Set(S.items.map(i => (i.person || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "tr")); }

  const list = all.filter(i => (S.catFilter === "all" || i.cat === S.catFilter) && (!S.personFilter || i.person === S.personFilter));

  const banner = isDemo() && S.mode !== "loading" ? `<div class="banner"><p><b>Bunlar örnek parçalar.</b> Kıyafetlerinin, ayakkabılarının, saat ve takılarının fotoğrafını çekip ekle. İlk parçanı kaydettiğinde örnekler kaybolur.</p><button class="btn primary" data-act="add">İlk parçayı ekle</button></div>` : "";
  const cats = `<div class="chips" role="group" aria-label="Kategori">${[{ k: "all", t: "Tümü" }, ...CATS].map(c => `<button class="chip" data-cat="${c.k}" aria-pressed="${S.catFilter === c.k}">${c.t} <span class="n">${count(c.k)}</span></button>`).join("")}</div>`;
  const pf = ppl.length > 1 ? `<div class="chips" role="group" aria-label="Kişi"><button class="chip" data-pf="" aria-pressed="${!S.personFilter}">Herkes</button>${ppl.map(p => `<button class="chip" data-pf="${esc(p)}" aria-pressed="${S.personFilter === p}">${esc(p)}</button>`).join("")}</div>` : "";
  const grid = S.mode === "loading" ? `<div class="empty"><span class="spin"></span></div>` :
    list.length ? `<div class="grid">${list.map(i => `<button class="item" data-item="${i.id}">${thumb(i, i.demo ? '<span class="badge">Örnek</span>' : "")}<div class="meta"><span class="nm">${esc(i.name || i.sub)}</span><span class="kd">${dot(i.color)}<span>${esc(i.sub)}${i.person ? " · " + esc(i.person) : ""}</span></span></div></button>`).join("")}</div>`
      : `<div class="empty">Bu kategoride henüz parça yok.<br><br><button class="btn primary" data-act="add">Parça ekle</button></div>`;
  return `<section class="view">${head}${banner}${cats}${pf}${grid}</section>`;

function slotHTML(it, main) {
  const locked = Object.values(S.locks).includes(it.id);
  return `<div class="slot ${main ? "main" : ""} ${locked ? "locked" : ""}">${thumb(it)}<span class="cap">${esc(it.name || it.sub)}</span><button class="lock" data-lock="${it.id}" aria-pressed="${locked}" aria-label="${locked ? "Sabitlemeyi kaldır" : "Bu parçayı sabitle"}: ${esc(it.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor" stroke="none"/><path d="${locked ? "M8 11V8a4 4 0 0 1 8 0v3" : "M8 11V8a4 4 0 0 1 7.5-2"}"/></svg></button></div>`;
}
function outfitCard(o, idx) {

  return `<article class="outfit"><div class="tagline"><span class="hole" aria-hidden="true"></span><h3>${esc(o.title)}</h3>${o.ai ? '<span class="score">Stilist</span>' : `<span class="score">Kombin ${idx + 1}</span>`}</div>
  <div class="board"><div class="col">${main.map(i => slotHTML(i, true)).join("")}</div><div class="col acc">${acc.map(i => slotHTML(i, false)).join("")}</div></div>
  ${o.why && o.why.length ? `<div class="why">${o.why.map(w => `<span>${esc(w)}</span>`).join("")}</div>` : ""}
  <div class="actions"><button class="btn" data-save="${idx}"${isDemo() ? " disabled" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>${isDemo() ? "Örnekler kaydedilmez" : "Kaydet"}</button></div></article>`;
}
function viewKombin() {
  const ppl = persons();

  const controls = `<div class="controls">

    ${chipRow("Mevsim", SEASONS, S.season, "data-season")}
    ${ppl.length > 1 ? chipRow("Kimin için", ["", ...ppl], S.forPerson, "data-for") : ""}
    <div class="row"><button class="btn primary" data-act="gen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>${S.suggestions.length ? "Yeni kombinler" : "Kombin oluştur"}</button>
    ${sample ? `<button class="btn" data-act="ai"${S.aiBusy ? " disabled" : ""}>${S.aiBusy ? '<span class="spin"></span>Stilist düşünüyor' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z"/><path d="M18.5 15l.8 2 2 .8-2 .7-.8 2-.7-2-2-.7 2-.8z"/></svg>Stiliste sor'}</button>` : ""}
    ${nLocks ? `<button class="btn ghost" data-act="unlock">Sabitlenenleri bırak (${nLocks})</button>` : ""}</div>
    <p class="sub" style="margin:0">Bir parçanın kilidine dokunursan o parça sabit kalır, diğerleri yenilenir.</p></div>`;
  const body = S.genError ? `<div class="empty">${esc(S.genError)}</div>` : S.suggestions.length ? `<div class="outfits">${S.suggestions.map(outfitCard).join("")}</div>` : `<div class="empty">Ortamı ve mevsimi seç, sonra “Kombin oluştur”a dokun.</div>`;
  const banner = isDemo() && S.mode !== "loading" ? `<div class="banner"><p><b>Örnek gardıropla gösteriliyor.</b> Kendi parçalarını ekleyince kombinler onlardan oluşur.</p></div>` : "";
  return `<section class="view"><div><h2>Bugün ne giysem?</h2><p class="sub">Renk uyumu, mevsim ve ortama göre seçilir.</p></div>${banner}${controls}${body}</section>`;
}
function viewKayit() {
  const list = S.outfits;
  const body = list.length ? list.map(o => {
    const its = (o.ids || []).map(byId).filter(Boolean);
    return `<div class="saved"><div class="row"><div style="min-width:0;flex:1"><strong>${esc(o.title)}</strong><p class="sub">${esc([o.occ !== "Hepsi" ? o.occ : "", o.season].filter(Boolean).join(" · "))} · ${its.length} parça</p></div><button class="btn ghost" data-wear="${o.id}">Aç</button><button class="btn ghost danger" data-delo="${o.id}" aria-label="Kombini sil">Sil</button></div><div class="strip">${its.map(i => thumb(i)).join("")}</div></div>`;
  }).join("") : `<div class="empty">Beğendiğin kombinleri “Kaydet” ile buraya ekle.</div>`;
  return `<section class="view"><div><h2>Kaydedilenler</h2><p class="sub">${list.length} kombin</p></div>${body}</section>`;
}

function render() {
  const chip = $("#storeChip");
  chip.textContent = { loading: "Yükleniyor", cloud: "Hesabında kayıtlı", local: "Bu cihazda kayıtlı", memory: "Kaydedilmiyor" }[S.mode];
  chip.className = "store-chip" + (S.mode === "cloud" ? " cloud" : "");
  chip.title = S.mode === "cloud" ? "Bu sayfayı açabilen herkes aynı gardırobu görür." : S.mode === "local" ? "Parçalar yalnızca bu tarayıcıda saklanır." : "";
  const app = $("#app");
  app.innerHTML = S.tab === "dolap" ? viewDolap() : S.tab === "kombin" ? viewKombin() : viewKayit();
  document.querySelectorAll("nav.tabs button").forEach(b => b.toggleAttribute("aria-current", false) || (b.dataset.tab === S.tab && b.setAttribute("aria-current", "page")));
  $("#fab").hidden = S.tab !== "dolap";
}

/* ---------- Editor sheet ---------- */
let F = null;
function openEditor(item) {
  F = item ? { id: item.id, name: item.name || "", cat: item.cat, sub: item.sub, color: item.color, styles: new Set(item.styles || []), seasons: new Set(item.seasons || []), person: item.person || "", preview: imgSrc(item), blob: null, confirmDel: false, busy: false }
    : { id: null, name: "", cat: "ust", sub: "Tişört", color: "", styles: new Set(), seasons: new Set(), person: S.personFilter || "", preview: "", blob: null, confirmDel: false, busy: false };
  if (!item && S.catFilter !== "all") { F.cat = S.catFilter; F.sub = CAT[F.cat].subs[0]; }
  S.aiNote = "";
  drawEditor();
}
function closeEditor() { F = null; const o = $("#overlay"); if (o) o.remove(); }
function drawEditor() {
  let o = $("#overlay");
  if (!o) { o = document.createElement("div"); o.id = "overlay"; o.className = "overlay"; o.addEventListener("click", e => { if (e.target === o) closeEditor(); }); document.body.append(o); }
  const c = CAT[F.cat];
  const ppl = persons();
  const prev = F.preview ? `<div class="ph"><img src="${esc(F.preview)}" alt="Seçilen fotoğraf"></div>` : thumb({ cat: F.cat, color: F.color || "Gri" });
  const scrollTop = o.firstElementChild ? o.firstElementChild.scrollTop : 0;
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <div class="sheet-head"><h2 id="edTitle">${F.id ? "Parçayı düzenle" : "Yeni parça"}</h2><button class="btn ghost" data-ed="close" aria-label="Kapat">Kapat</button></div>
    <div class="photo-box">${prev}<div class="photo-btns">
      <button class="btn primary" data-ed="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Fotoğraf çek</button>
      <button class="btn" data-ed="gal">Galeriden seç</button>
      <div class="ai-note" aria-live="polite">${S.aiNote}</div></div></div>
    <div class="field"><span class="label">Kategori</span><div class="chips wrapr">${CATS.map(x => `<button class="chip" data-fcat="${x.k}" aria-pressed="${F.cat === x.k}">${x.t}</button>`).join("")}</div></div>
    <div class="field"><span class="label">Tür</span><div class="chips wrapr">${c.subs.map(s => `<button class="chip" data-fsub="${esc(s)}" aria-pressed="${F.sub === s}">${esc(s)}</button>`).join("")}</div></div>
    <div class="field"><label class="label" for="fName">Ad</label><input type="text" id="fName" maxlength="60" placeholder="ör. Lacivert keten gömlek" value="${esc(F.name)}"></div>
    <div class="field"><span class="label">Renk</span><div class="swatches">${COLORS.map(x => `<button class="sw" data-fcol="${x.k}" aria-pressed="${F.color === x.k}" aria-label="${x.k}" title="${x.k}" style="background:${x.h}"></button>`).join("")}</div><span class="sw-name">${F.color ? esc(F.color) : "Renk seçilmedi"}</span></div>
    <div class="field"><span class="label">Nerede giyilir</span><div class="chips wrapr">${STYLES.map(s => `<button class="chip" data-fsty="${s}" aria-pressed="${F.styles.has(s)}">${s}</button>`).join("")}</div></div>
    <div class="field"><span class="label">Mevsim <span style="text-transform:none;letter-spacing:0;font-weight:400">(boş bırakırsan her mevsim)</span></span><div class="chips wrapr">${SEASONS.map(s => `<button class="chip" data-fsea="${s}" aria-pressed="${F.seasons.has(s)}">${s}</button>`).join("")}</div></div>
    <div class="field"><label class="label" for="fPerson">Kimin <span style="text-transform:none;letter-spacing:0;font-weight:400">(isteğe bağlı)</span></label><input type="text" id="fPerson" maxlength="30" list="pList" placeholder="ör. Mustafa" value="${esc(F.person)}"><datalist id="pList">${ppl.map(p => `<option value="${esc(p)}">`).join("")}</datalist></div>
    ${F.confirmDel ? `<div class="confirm"><p>Bu parça kalıcı olarak silinsin mi?</p><button class="btn" data-ed="nodel">Vazgeç</button><button class="btn primary" style="background:var(--danger);border-color:var(--danger)" data-ed="yesdel">Sil</button></div>` : ""}
    <div class="row">${F.id ? `<button class="btn ghost danger" data-ed="del">Sil</button>` : ""}<span class="spacer"></span><button class="btn" data-ed="close">Vazgeç</button><button class="btn primary" data-ed="save"${F.busy ? " disabled" : ""}>${F.busy ? '<span class="spin"></span>Kaydediliyor' : "Kaydet"}</button></div>
  </div>`;
  o.firstElementChild.scrollTop = scrollTop;
}
function syncText() { const n = $("#fName"), p = $("#fPerson"); if (n) F.name = n.value; if (p) F.person = p.value; }

async function onPhoto(file) {
  if (!file || !F) return;
  try {
    const blob = await shrink(file, 1000, .82);
    if (!F) return;
    F.blob = blob; F.preview = URL.createObjectURL(blob);
    S.aiNote = sample && sampleImages ? '<span class="spin"></span> Fotoğraftan tanınıyor…' : "";
    syncText(); drawEditor();
    if (sample && sampleImages) autoTag(blob);
  } catch { toast("Fotoğraf açılamadı. Başka bir fotoğraf deneyin."); }
}
async function autoTag(blob) {
  const prompt = `Fotoğraftaki tek giyim/aksesuar parçasını tanımla. Yalnızca JSON nesnesi döndür:
{"cat": "${CATS.map(c => c.k).join("|")}", "sub": "kategoriye uygun tür", "color": "${COLORS.map(c => c.k).join("|")}", "styles": [${STYLES.map(s => `"${s}"`).join(",")} içinden uygunlar], "seasons": [${SEASONS.map(s => `"${s}"`).join(",")} içinden uygunlar, her mevsime uygunsa boş dizi], "name": "kısa Türkçe ad, ör. Lacivert keten gömlek"}
Türler: ${CATS.map(c => c.k + ": " + c.subs.join(", ")).join("; ")}.`;
  try {
    const r = await sample.json(prompt, { images: [blob], modelTier: "quick" });
    if (!F || F.blob !== blob || !r || typeof r !== "object") { S.aiNote = ""; if (F) drawEditor(); return; }
    syncText();
    if (CAT[r.cat]) { F.cat = r.cat; F.sub = CAT[r.cat].subs.includes(r.sub) ? r.sub : CAT[r.cat].subs[0]; }
    if (COL[r.color]) F.color = r.color;
    if (Array.isArray(r.styles)) F.styles = new Set(r.styles.filter(s => STYLES.includes(s)));
    if (Array.isArray(r.seasons)) F.seasons = new Set(r.seasons.filter(s => SEASONS.includes(s)));
    if (!F.name && r.name) F.name = String(r.name).slice(0, 60);
    S.aiNote = "Alanlar fotoğraftan dolduruldu. Kontrol edip kaydet.";
  } catch (e) { S.aiNote = e && e.code === "not_granted" ? "" : "Otomatik tanıma olmadı, alanları elle seç."; }
  if (F) drawEditor();
}
async function submit() {
  syncText();
  if (!F.color) { toast("Bir renk seç."); return; }
  if (!F.name.trim()) F.name = `${F.color} ${F.sub.toLowerCase()}`;
  F.busy = true; drawEditor();
  try {
    await saveItem({ id: F.id, name: F.name.trim(), cat: F.cat, sub: F.sub, color: F.color, styles: [...F.styles], seasons: [...F.seasons], person: F.person.trim() }, F.blob);
    const wasNew = !F.id; closeEditor(); toast(wasNew ? "Gardıroba eklendi" : "Güncellendi");
  } catch (e) {
    F.busy = false; drawEditor();
    toast(e && e.code === "quota_exceeded" ? "Depolama dolu. Bazı parçaları silin." : e && e.code === "invalid_argument" ? "Bu sayfada kaydetme izniniz yok." : "Kaydedilemedi. Tekrar deneyin.");
  }
}

/* ---------- Events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; render(); window.scrollTo(0, 0); return; }
  if (t.id === "fab" || d.act === "add") { openEditor(null); return; }
  if (d.cat) { S.catFilter = d.cat; render(); return; }
  if (d.pf !== undefined && t.closest("#app")) { S.personFilter = d.pf; render(); return; }
  if (d.item) { const it = byId(d.item); if (it?.demo) toast("Bu bir örnek parça. Kendi parçalarını ekleyince kaybolur."); else if (it) openEditor(it); return; }
  if (d.occ) { S.occ = d.occ; if (S.suggestions.length) generate(); else render(); return; }
  if (d.season) { S.season = d.season; if (S.suggestions.length) generate(); else render(); return; }
  if (d.for !== undefined) { S.forPerson = d.for; S.locks = {}; if (S.suggestions.length) generate(); else render(); return; }
  if (d.act === "gen") { generate(); return; }
  if (d.act === "ai") { askStylist(); return; }
  if (d.act === "unlock") { S.locks = {}; render(); return; }
  if (d.lock) {
    const it = byId(d.lock); if (!it) return;
    const slot = it.cat === "taki" ? "taki" : it.cat;
    if (S.locks[slot] === it.id) delete S.locks[slot];
    else { S.locks[slot] = it.id; if (it.cat === "elbise") { delete S.locks.ust; delete S.locks.alt; } if (it.cat === "ust" || it.cat === "alt") delete S.locks.elbise; }
    render(); return;
  }
  if (d.save !== undefined) {
    const o = S.suggestions[+d.save]; if (!o || isDemo()) return;
    try { await saveOutfit(o); toast("Kombin kaydedildi"); } catch { toast("Kaydedilemedi. Tekrar deneyin."); }
    return;
  }
  if (d.delo) { try { await deleteOutfit(d.delo); toast("Kombin silindi"); } catch { toast("Silinemedi."); } return; }
  if (d.wear) {
    const o = S.outfits.find(x => x.id === d.wear); if (!o) return;
    S.suggestions = [{ ids: o.ids.filter(byId), title: o.title, why: [] }]; S.genError = ""; S.tab = "kombin"; render(); window.scrollTo(0, 0); return;
  }
  // editor
  if (!F) return;
  if (d.ed === "close") { closeEditor(); return; }
  if (d.ed === "cam") { $("#camIn").click(); return; }
  if (d.ed === "gal") { $("#galIn").click(); return; }
  syncText();
  if (d.fcat) { F.cat = d.fcat; F.sub = CAT[F.cat].subs[0]; }
  else if (d.fsub) F.sub = d.fsub;
  else if (d.fcol) F.color = d.fcol;
  else if (d.fsty) F.styles.has(d.fsty) ? F.styles.delete(d.fsty) : F.styles.add(d.fsty);
  else if (d.fsea) F.seasons.has(d.fsea) ? F.seasons.delete(d.fsea) : F.seasons.add(d.fsea);
  else if (d.ed === "del") F.confirmDel = true;
  else if (d.ed === "nodel") F.confirmDel = false;
  else if (d.ed === "yesdel") { try { await deleteItem(F.id); closeEditor(); toast("Parça silindi"); } catch { toast("Silinemedi."); } return; }
  else if (d.ed === "save") { submit(); return; }
  else return;
  drawEditor();
});
for (const id of ["camIn", "galIn"]) $("#" + id).addEventListener("change", e => { const f = e.target.files && e.target.files[0]; e.target.value = ""; onPhoto(f); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && F) closeEditor(); });

window.__back = () => { if (F) { closeEditor(); return true; } if (S.tab !== "dolap") { S.tab = "dolap"; render(); window.scrollTo(0, 0); return true; } return false; };

init();
})();
</script>
</body></html>
