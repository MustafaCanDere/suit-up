plugins {
    id "com.android.application"
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace "com.gardirobum.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.gardirobum.app"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    signingConfigs {
        // Imza anahtari GitHub Secrets'ta saklanir; yoksa debug anahtari kullanilir.
        release {
            def ks = System.getenv("KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.webkit:webkit:1.11.0"
}
